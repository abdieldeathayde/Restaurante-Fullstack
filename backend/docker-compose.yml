services:
  mysql:
    image: mysql:8.4
    container_name: restauranteapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurante}
      MYSQL_USER: ${MYSQL_USER:-restaurante_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - restaurante_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [restaurante-net]

  api:
    build: .
    container_name: restauranteapp-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-restaurante}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-restaurante_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change_me_local}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks: [restaurante-net]

volumes:
  restaurante_mysql_data:

networks:
  restaurante-net:
